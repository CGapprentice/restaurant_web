<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Dougies</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>Dougies</h1>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links">
                <li class="cart">
                    <a href="cart.html" class="active">
                        <image src="assets/cart_design.png">
                        <span class="cart-count" id="cart-count">0</span>
                    </a>
                </li>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="cart-page">
        <h1>Shopping Cart</h1>

        <div class="cart-container">
            <div class="cart-items" id="cart-items">
                <p class="empty-cart">Your cart is empty. <a href="menu.html">Browse our menu</a></p>
            </div>

            <div class="cart-summary">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="cart-subtotal">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="cart-total">$0.00</span>
                </div>
                <button id="clear-cart" class="clear-btn">Clear Cart</button>
                <button class="checkout-btn">Proceed to Checkout</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Hours</h3>
                <p>Monday - Thursday: 8am - 11pm</p>
                <p>Friday - Saturday: 8am - 12am</p>
                <p>Sunday: 8am - 11pm</p>
            </div>
            <div class="footer-section">
                <h3>Follow Us</h3>
                <div class="social-links">
                    <a href="https://www.facebook.com/Dougiesjamaicancuisine/" target="_blank" aria-label="Facebook">Facebook</a>
                    <a href="https://www.grubhub.com/restaurant/dougies-jamaican-cuisine-9604-ave-l-brooklyn/339389" target="_blank" aria-label="GrubHub">GrubHub</a>
                </div>
            </div>
        </div>

    </footer>

    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
