services:
  # 1. The Backend
  - type: web
    name: restaurant-backend
    runtime: node
    # Remove 'root' property and use 'cd' instead
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: MONGODB_URI
        sync: false
    plan: free

  # 2. The Frontend
  - type: web
    name: restaurant-frontend
    runtime: node
    # Runs in root by default
    buildCommand: npm install && npm run build
    # Use 'serve' to serve the 'dist' folder on the correct port
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_URL
        value: https://restaurant-backend.onrender.com
    plan: free
