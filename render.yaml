services:
  # 1. The Backend
  - type: web
    name: restaurant-backend
    runtime: node
    # Remove 'root' property and use 'cd' instead
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: MONGODB_URI
        sync: false
    plan: free # Included free plan

  # 2. The Frontend
  - type: web
    name: restaurant-frontend
    runtime: node
    # Runs in root by default, so no 'cd' needed here
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://restaurant-backend.onrender.com # Directly assign the predictable URL
    plan: free # Included free plan