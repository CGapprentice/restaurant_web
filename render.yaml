services:
  # 1. The Backend
  - type: web
    name: restaurant-backend
    runtime: node
    root: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
    plan: free

  # 2. The Frontend (Served as a Web Service)
  - type: web
    name: restaurant-frontend
    runtime: node
    root: .
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: restaurant-backend
          property: url
